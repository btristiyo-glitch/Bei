name: IDX Scanner

on:
  schedule:
    - cron: '30 0 * * 1-5'   # 07:30 WIB - pre-market gap detect
    - cron: '15 2 * * 1-5'   # 09:15 WIB - konfirmasi 15m pasca open ★
    - cron: '30 3 * * 1-5'   # 10:30 WIB - window entry emas ★
    - cron: '0 5 * * 1-5'    # 12:00 WIB - scan harian
    - cron: '0 11 * * 1-5'   # 18:00 WIB - scan harian
  workflow_dispatch:        # biar bisa dipencet manual

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  scan-idx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            scan_results.csv
            top10_results.csv
            gainer_candidates.csv
          if-no-files-found: ignore
